<div class="view flex flex-direction-column flex-grow"
     data-controller="__plugin/embydjdashboard"
     data-title="EmbyDJ">
  <!--
    Keep this shell stable: Emby caches plugin pages keyed by the SERVER version only.
    The actual DJ app lives at /EmbyDJ/Web/index.html (served by the plugin, never stale).
  -->
  <div class="embydj-shell" style="display:flex;flex-direction:column;flex-grow:1;height:100%;padding:.5em 1em 1em;box-sizing:border-box;">
    <iframe class="embydj-frame" title="EmbyDJ" allow="autoplay; fullscreen"
            style="flex-grow:1;width:100%;min-height:500px;border:0;border-radius:6px;background:#111;"></iframe>
  </div>
</div>
